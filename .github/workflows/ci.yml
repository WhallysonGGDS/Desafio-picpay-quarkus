name: CI

# Roda o que o README manda rodar, na mesma ordem: testes e testes de integração do back-end (que também constroem o front-end e
# gravam o contrato OpenAPI), tipos, testes e orçamento de pacote do front-end e, por último, a suíte de ponta a ponta no
# Chromium contra o jar empacotado.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Back-end, front-end e ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependências do front-end
        run: npm --prefix frontend ci

      - name: Back-end (testes, testes de integração sobre o jar e build do front-end)
        run: ./mvnw -B -ntp verify -DskipITs=false

      - name: Tipos
        run: npm --prefix frontend run typecheck

      - name: Testes do front-end
        run: npm --prefix frontend test

      - name: Tipos da API em dia com o contrato OpenAPI
        run: npm --prefix frontend run check:api

      - name: Build e orçamento dos pacotes
        run: |
          npm --prefix frontend run build
          npm --prefix frontend run check:bundle

      - name: Chromium do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Ponta a ponta
        run: npm --prefix frontend run e2e

      - name: Rastros do Playwright (só se algo falhou)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

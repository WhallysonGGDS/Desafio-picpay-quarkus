# Configurações do Hibernate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect

# Configuração do banco de dados H2
quarkus.datasource.db-kind=h2
# LOCK_TIMEOUT: transferências do mesmo remetente esperam uma pela outra (lock de saldo) enquanto
# o autorizador responde; o padrão do H2 (2 s) é menor que o timeout do autorizador (3 s).
quarkus.datasource.jdbc.url=jdbc:h2:mem:picpay;INIT=SET LOCK_TIMEOUT 10000
quarkus.datasource.username=sa
quarkus.datasource.password=

# Serviços externos (clientes REST em dev.whallyson.mocks). Os locks de saldo ficam retidos enquanto o
# autorizador responde, por isso o timeout de leitura dele é curto (3 s); o notificador tem 2 s.
quarkus.rest-client.authorizer.url=https://util.devi.tools
quarkus.rest-client.authorizer.connect-timeout=1000
quarkus.rest-client.authorizer.read-timeout=3000
quarkus.rest-client.notifier.url=https://util.devi.tools
quarkus.rest-client.notifier.connect-timeout=1000
quarkus.rest-client.notifier.read-timeout=2000

# Cadastro: saldo inicial de todo usuário comum (lojista começa com 0.00). Nunca vem do cliente.
app.signup.initial-balance=1000.00

# Contas de demonstração (marina@arco.demo, rafael@arco.demo, loja@arco.demo; senha demo1234).
# Desligado por padrão e em produção; ligado no modo dev.
app.seed.enabled=false
%dev.app.seed.enabled=true

# OpenAPI: o esquema também é gravado no build, e o front gera seus tipos a partir dele.
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.smallrye-openapi.info-title=Arco API
quarkus.smallrye-openapi.info-version=1.0.0

# Sessão: JWT em cookie HttpOnly. A autenticação é preguiçosa de propósito: um cookie velho ou inválido
# enviado a uma rota pública (login, cadastro, logout) é ignorado em vez de responder 401.
# Chaves: se nada for configurado, um par RSA efêmero é gerado (ver EphemeralJwtKeysConfigSource).
# Em produção defina SMALLRYE_JWT_SIGN_KEY e MP_JWT_VERIFY_PUBLICKEY (conteúdo PEM, não caminho de arquivo).
quarkus.http.auth.proactive=false
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=arco_session
mp.jwt.verify.issuer=arco
app.jwt.lifetime=PT1H
app.jwt.cookie-secure=true
%dev.app.jwt.cookie-secure=false
%test.app.jwt.cookie-secure=false

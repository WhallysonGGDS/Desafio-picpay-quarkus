# Configurações do Hibernate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect

# Configuração do banco de dados H2
quarkus.datasource.db-kind=h2
# DB_CLOSE_DELAY=-1: o H2 apaga um banco "mem:" quando a última conexão fecha, e o pool do Quarkus começa com zero conexões e
# fecha as ociosas (5 minutos por padrão). Sem isto, um app parado por esse tempo voltava com o banco VAZIO, sem tabelas, e todo
# pedido respondia 500 até um reinício. Com isto o banco vive tanto quanto a JVM.
# LOCK_TIMEOUT: transferências da mesma conta esperam uma pela outra (lock de saldo) enquanto o banco trabalha; o padrão do H2
# (2 s) é folgado para isso, e 10 s cobre uma rajada em cima de uma única conta.
quarkus.datasource.jdbc.url=jdbc:h2:mem:picpay;DB_CLOSE_DELAY=-1;INIT=SET LOCK_TIMEOUT 10000
quarkus.datasource.username=sa
quarkus.datasource.password=

# Serviços externos (clientes REST em dev.whallyson.mocks). O autorizador é chamado SEM transação aberta e sem lock de saldo (o
# TransactionService confere, autoriza e só então trava e grava), então uma resposta lenta dele não segura conexão do pool nem trava
# outras transferências da mesma conta; o timeout de leitura curto (3 s) é para o pedido não esperar à toa. O notificador tem 2 s.
quarkus.rest-client.authorizer.url=https://util.devi.tools
quarkus.rest-client.authorizer.connect-timeout=1000
quarkus.rest-client.authorizer.read-timeout=3000
quarkus.rest-client.notifier.url=https://util.devi.tools
quarkus.rest-client.notifier.connect-timeout=1000
quarkus.rest-client.notifier.read-timeout=2000

# Cadastro: saldo inicial de todo usuário comum (lojista começa com 0.00). Nunca vem do cliente.
app.signup.initial-balance=1000.00

# Contas de demonstração (marina@arco.demo, rafael@arco.demo, loja@arco.demo; senha demo1234).
# Desligado por padrão e em produção; ligado no modo dev.
app.seed.enabled=false
%dev.app.seed.enabled=true

# OpenAPI: o esquema também é gravado no build, e o front gera seus tipos a partir dele.
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.smallrye-openapi.info-title=Arco API
quarkus.smallrye-openapi.info-version=1.0.0
# O recurso de sonda dos testes (/__probe, só em src/test) fica fora do contrato: o esquema que um `./mvnw test` grava em
# target/openapi não pode ganhar rotas que não existem em produção (o `check:api` do front reprovaria de mentira).
%test.mp.openapi.scan.exclude.classes=dev.whallyson.infra.ErrorProbeResource

# Sessão: JWT em cookie HttpOnly. A autenticação é preguiçosa de propósito: um cookie velho ou inválido
# enviado a uma rota pública (login, cadastro, logout) é ignorado em vez de responder 401.
# Chaves: se nada for configurado, um par RSA efêmero é gerado (ver EphemeralJwtKeysConfigSource).
# Em produção defina SMALLRYE_JWT_SIGN_KEY e MP_JWT_VERIFY_PUBLICKEY (conteúdo PEM, não caminho de arquivo).
quarkus.http.auth.proactive=false
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=arco_session
mp.jwt.verify.issuer=arco
app.jwt.lifetime=PT1H
app.jwt.cookie-secure=true
%dev.app.jwt.cookie-secure=false
%test.app.jwt.cookie-secure=false

# Front-end: o Quinoa roda o build de frontend/ no Maven e o serve na mesma origem da API (cookie de sessão, sem CORS).
# Compilar só o back-end: -Dquarkus.quinoa=false (a chave é a própria quarkus.quinoa, e não quarkus.quinoa.enabled).
# ignored-path-prefixes: o que é da API e nunca vira rota do SPA. Também alimenta o SpaFallback (infra), que em
# produção e em dev devolve o index.html nas navegações para rotas do front (atualizar a página em /carteira); o
# fallback do Quinoa não roda atrás do GlobalExceptionHandler. Em dev a raiz é o proxy do Quinoa para o Vite.
quarkus.quinoa.ui-dir=frontend
quarkus.quinoa.build-dir=dist
quarkus.quinoa.package-manager=npm
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/auth,/users,/transaction,/hello,/q
%dev.quarkus.quinoa.dev-server.port=5173
%test.quarkus.quinoa=false
# O navegador aceita gzip e o orçamento do bundle é medido nele: sem isto a entrada de uns 127 kB baixa com uns 400 kB.
# (O Quarkus vem com a compressão desligada.)
quarkus.http.enable-compression=true

# Cabeçalhos de segurança. nosniff e Referrer-Policy valem em todo perfil. A política de conteúdo (CSP) e o X-Frame-Options só em
# produção: em dev o Vite injeta um script embutido (a recarga ao vivo) e usa websocket, e a Dev UI do Quarkus se enquadra. O front
# não carrega nada de terceiros nem injeta HTML, então a política é a mais estrita que serve: só a própria origem, nenhum script
# embutido ou gerado, nenhum objeto, ninguém enquadra o app e nenhum formulário envia para fora. (Os estilos que o React e o GSAP
# aplicam pelo CSSOM, element.style, não são "estilo embutido" para a CSP.)
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
%prod.quarkus.http.header."X-Frame-Options".value=DENY
%prod.quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'

# Log: o Hibernate registra em ERROR cada violação de unicidade, e a mensagem do H2 traz o VALOR do índice (o e-mail ou o CPF de quem
# tentou se cadastrar de novo). O 409 é um caminho normal e já é tratado pelo UserService; uma falha de SQL inesperada continua no log
# pelo GlobalExceptionHandler, que registra a exceção inteira.
quarkus.log.category."org.hibernate.engine.jdbc.spi.SqlExceptionHelper".level=OFF
